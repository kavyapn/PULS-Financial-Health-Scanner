<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e2a78">
  <meta name="description" content="PULS financial health scanner concept for Deutsche Bank.">
  <title>PULS · Financial health scanner</title>
  <link rel="icon" type="image/svg+xml" href="./assets/deutsche-bank.svg">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./branch.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a href="#main" class="skip">Skip to content</a>
  <header class="site-header">
    <div class="shell header-inner">
      <button type="button" class="brand" data-action="home" aria-label="Deutsche Bank demo home">
        <img src="./assets/deutsche-bank.svg" width="32" height="32" alt="">
        <span>Deutsche Bank</span>
      </button>
      <div class="mode-switch" role="group" aria-label="Prototype view">
        <button type="button" data-action="terminal" aria-pressed="true">Branch</button>
        <button type="button" data-action="phone" aria-pressed="false">Mobile banking</button>
      </div>
    </div>
    <div id="puls-module-navigation" class="shell" hidden></div>
  </header>
  <main id="main" class="shell" tabindex="-1"></main>
  <footer class="shell site-footer">PULS · Hackathon prototype · Demo banking data</footer>
  <div id="bank-navigation"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <dialog id="idle-dialog" aria-labelledby="idle-title" aria-describedby="idle-description">
    <div class="timeout-content">
      <h2 id="idle-title">Still using the terminal?</h2>
      <p id="idle-description">For privacy, your session will close in <strong id="idle-countdown">30 seconds</strong>.</p>
      <span class="sr-only" id="idle-announcement" aria-live="polite"></span>
      <div class="actions">
        <button type="button" class="button quiet" data-action="end-confirm">End session</button>
        <button type="button" class="button" data-action="keep-session">Continue session</button>
      </div>
    </div>
  </dialog>
  <div class="toast" role="status" aria-live="polite"></div>
  <noscript>Enable JavaScript to start the demo.</noscript>
</body>
</html>
